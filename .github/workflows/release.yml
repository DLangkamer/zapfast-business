name: Release ZapFast Business

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZAPFAST_BUSINESS_GIPHY_KEY: ${{ secrets.ZAPFAST_BUSINESS_GIPHY_KEY }}

jobs:
  source:
    name: Validar versão e branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir tag na branch Business
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/business/windows-isolation:refs/remotes/origin/business/windows-isolation
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/business/windows-isolation
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "packaging/release-notes/${GITHUB_REF_NAME}.md"

  windows:
    name: Windows x64
    needs: source
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Compilar
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Criar pacote portátil
        shell: pwsh
        run: |
          $name = "zapfast-business-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/zapfast-business.exe" "dist/$name/"
          Copy-Item README.md,BUSINESS.md,LICENSE,THIRD-PARTY-NOTICES.md,packaging/zapfast-business-portable.txt "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - name: Criar instalador separado
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DNumericVersion=$version" "/DArch=x86_64" `
            "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\zapfast-business.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\zapfast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Atestar pacotes
        uses: crmne/native-packages/.github/actions/attest@dc0cb1586894ca0239c53fd02d4da8064712671c
        with:
          subject-path: |
            dist/*.zip
            dist/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publicar release assinada
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Assinar manifesto de atualização
        uses: crmne/native-packages/.github/actions/sign-release@dc0cb1586894ca0239c53fd02d4da8064712671c
        with:
          directory: dist
          public-key: assets/business-update-public-key.hex
          key-env: ZAPFAST_BUSINESS_UPDATE_SIGNING_KEY
        env:
          ZAPFAST_BUSINESS_UPDATE_SIGNING_KEY: ${{ secrets.ZAPFAST_BUSINESS_UPDATE_SIGNING_KEY }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          name: ZapFast Business ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true

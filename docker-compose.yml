services:
  zapfast-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zapfast-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "47120:47120/udp"
    volumes:
      - zapfast_data:/app/data
    environment:
      - RUST_LOG=info

volumes:
  zapfast_data:
    name: zapfast_server_data
